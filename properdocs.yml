site_name: Desarrollo Web en Entorno Servidor 2026/27
nav:
  - Inicio: index.md
  - PREVIO:
      - UT00 - BUENAS PRÁCTICAS EN DESARROLLO WEB: ut00.md
  - BLOQUE 1:
      - UT01 - LENGUAJES DE GUIONES (SCRITP) CLIENTE/SERVIDOR: ut01.md
      - UT02 - INTEGRACIÓN DEL CÓDIGO EN LENGUAJES DE MARCAS: ut02.md
      - UT03 - PROGRAMACIÓN EN PHP INTEGRADO EN HTML: ut03.md
  - PRÁCTICAS:
      - UT00P01 - CONFIGURACIÓN DE VS CODE PARA DESARROLLO EN PHP: ut00p01.md
      - UT01P01 - INICIACIÓN A POSTMAN Y PETICIONES HTTP (GET / POST): ut01p01.md
      - UT02 - BOLETÍN DE PRÁCTICAS: ut02_practicas.md
      - EJEMPLOS DE USO DE FORMULARIOS: ut03-ejemplo01.md
      - UT03 - BOLETÍN DE PRÁCTICAS: ut03-practicas.md
theme:
  name: readthedocs
  locale: es
  features:
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.emoji
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.arithmatex
  - pymdownx.blocks.details
  - pymdownx.blocks.admonition
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.highlight
  - markdown.extensions.tables

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML
  - js/copy-button.js

extra_css:
  - css/estilo.css
